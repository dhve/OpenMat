name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace (default features, includes SUNDIALS)
        run: cargo test --workspace
      - name: Test pure-Rust solver path
        run: cargo test -p openmat-solve --no-default-features
      - name: WASM build check (M0 platform matrix)
        run: cargo check -p openmat-core -p openmat-solve --no-default-features --target wasm32-unknown-unknown

  app:
    name: Notebook app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
